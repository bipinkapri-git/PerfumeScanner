    :root {

      --layout-section-padding-block: 3rem;
      --layout-section-padding-inline--md: 40px;
      --layout-section-max-inline-size: 1420px;

      --element-text-font-weight--body: 400;
      --element-text-letter-spacing--body: 0.025em;
      --element-text-text-transform--body: none;

      /* Body Font Sizes */
      --element-text-font-size--body: initial;
      --element-text-font-size--body-xs: 11px;
      --element-text-font-size--body-sm: 13px;
      --element-text-font-size--body-md: 15px;
      --element-text-font-size--body-lg: 17px;
      
      /* Body Line Heights */
      --element-text-line-height--body: 1.3;

      /* Heading Font Styles */
      --element-text-font-family--heading: Muli;
      --element-text-font-family-fallback--heading: sans-serif;
      --element-text-font-weight--heading: 600;
      --element-text-letter-spacing--heading: 0.025em;
      
       
      
      
      /* Heading Font Sizes */
      --element-text-font-size--heading-2xl: 52px;
      --element-text-font-size--heading-xl: 36px;
      --element-text-font-size--heading-lg: 30px;
      --element-text-font-size--heading-md: 28px;
      --element-text-font-size--heading-sm: 22px;
      --element-text-font-size--heading-xs: 20px;
      
      /* Heading Line Heights */
      --element-text-line-height--heading: 1.3;

      /* Buttons */
      /* ========================= */
      
          --element-button-radius: 50px;
      

      --element-button-padding-block: 12px;
      --element-button-text-transform: uppercase;
      --element-button-font-weight: 800;
      --element-button-font-size: max(calc(var(--typeBaseSize) - 4px), 13px);
      --element-button-letter-spacing: .3em;

      /* Base Color Variables */
      --element-button-color-primary: #1c1d1d;
      --element-button-color-secondary: #ffffff;
      --element-button-shade-border: 100%;

      /* Hover State Variables */
      --element-button-shade-background--hover: 0%;
      --element-button-shade-border--hover: 100%;

      /* Focus State Variables */
      --element-button-color-focus: var(--color-focus);

      /* Inputs */
      /* ========================= */
      
          --element-icon-radius: 50px;
      

      --element-input-font-size: var(--element-text-font-size--body-sm);
      --element-input-box-shadow-shade: 100%;

      /* Hover State Variables */
      --element-input-background-shade--hover: 0%;
      --element-input-box-shadow-spread-radius--hover: 1px;
    }

    @media only screen and (max-width: 768px) {
      :root {
        --element-button-font-size: max(calc(var(--typeBaseSize) - 5px), 11px);
      }
    }

    .element-radio {
        &:has(input[type='radio']:checked) {
          --element-button-color: var(--element-button-color-secondary);
        }
    }

    /* ATC Button Overrides */
    /* ========================= */

    .element-button[type="submit"],
    .element-button[type="submit"] .element-text,
    .element-button--shopify-payment-wrapper button {
      --element-button-padding-block: 13px;
      --element-button-padding-inline: 20px;
      --element-button-line-height: 1.42;
      --_font-size--body-md: var(--element-button-font-size);

      line-height: 1.42 !important;
    }

    /* When dynamic checkout is enabled */
    product-form:has(.element-button--shopify-payment-wrapper) {
      --element-button-color: #1c1d1d;

      .element-button[type="submit"],
      .element-button--shopify-payment-wrapper button {
        min-height: 50px !important;
      }

      .shopify-payment-button {
        margin: 0;
      }
    }

    /* Hover animation for non-angled buttons */
    body:not([data-button_style='angled']) .element-button[type="submit"] {
      position: relative;
      overflow: hidden;

      &:after {
        content: '';
        position: absolute;
        top: 0;
        left: 150%;
        width: 200%;
        height: 100%;
        transform: skewX(-20deg);
        background-image: linear-gradient(to right,transparent, rgba(255,255,255,.25),transparent);
      }

      &:hover:after {
        animation: shine 0.75s cubic-bezier(0.01, 0.56, 1, 1);
      }
    }

    /* ANGLED STYLE - ATC Button Overrides */
    /* ========================= */
    
    [data-button_style='angled'] {
      --element-button-shade-background--active: var(--element-button-shade-background);
      --element-button-shade-border--active: var(--element-button-shade-border);

      .element-button[type="submit"] {
        --_box-shadow: none;

        position: relative;
        max-width: 94%;
        border-top: 1px solid #1c1d1d;
        border-bottom: 1px solid #1c1d1d;
        
        &:before,
        &:after {
          content: '';
          position: absolute;
          display: block;
          top: -1px;
          bottom: -1px;
          width: 20px;
          transform: skewX(-12deg);
          background-color: #1c1d1d;
        }
        
        &:before {
          left: -6px;
        }
        
        &:after {
          right: -6px;
        }
      }

      /* When dynamic checkout is enabled */
      product-form:has(.element-button--shopify-payment-wrapper) {
        .element-button[type="submit"]:before,
        .element-button[type="submit"]:after {
          background-color: color-mix(in srgb,var(--_color-text) var(--_shade-background),var(--_color-background));
          border-top: 1px solid #1c1d1d;
          border-bottom: 1px solid #1c1d1d;
        }

        .element-button[type="submit"]:before {
          border-left: 1px solid #1c1d1d;
        }
        
        .element-button[type="submit"]:after {
          border-right: 1px solid #1c1d1d;
        }
      }

      .element-button--shopify-payment-wrapper {
        --_color-background: #1c1d1d;

        button:hover,
        button:before,
        button:after {
          background-color: color-mix(in srgb,var(--_color-text) var(--_shade-background),var(--_color-background)) !important;
        }

        button:not(button:focus-visible) {
          box-shadow: none !important;
        }
      }
    }

  function bspdGetBarCookie(name) {
    const value = "; " + document.cookie;
    const parts = value.split("; " + name + "=");
    if (parts.length === 2) {
      return parts.pop().split(";").shift();
    }
    return null;
  }
  function bspdSetBarCookie(name, value, days) {
    const expires = new Date();

    expires.setTime(expires.getTime() + days * 24 * 60 * 60 * 1000);
    document.cookie = name + "=" + value + ";expires=" + expires.toUTCString() + ";path=/";
  }

  /**
   * method that stores a entry whenever the user visits any of the page
   * and increments the count by 1
   * the data schema looks like
   * {[DATE]: {date: string; route: {[ROUTE]: number}; count: number}}
   * this will be a json object whose key will be the date and value will be the object
   * and will be stored in local-storage
   */
  function trackLastVisitedCount() {
    const date = new Date();
    const dateString = date.toISOString().split("T")[0];

    let lastVisitedCount = JSON.parse(localStorage.getItem(BSPD_LAST_VISIT_COUNT_LOCAL_KEY)) || {};

    if (lastVisitedCount[dateString]) {
      lastVisitedCount[dateString].count += 1;

      // also update route
      const route = window.location.pathname;

      if (lastVisitedCount[dateString].route[route]) {
        lastVisitedCount[dateString].route[route] += 1;
      } else {
        lastVisitedCount[dateString].route[route] = 1;
      }
    } else {
      const route = window.location.pathname;

      lastVisitedCount[dateString] = {
        date: dateString,
        route: {
          [route]: 1,
        },
        count: 1,
      };
    }

    localStorage.setItem(BSPD_LAST_VISIT_COUNT_LOCAL_KEY, JSON.stringify(lastVisitedCount));
  }

      dt = Math.floor(dt / 16);
      return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
