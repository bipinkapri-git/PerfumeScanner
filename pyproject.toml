[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfume-scanner"
version = "1.1.0"
description = "A Python-based application for scanning and identifying perfumes."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Adimn"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit>=1.20.0",
    "beautifulsoup4>=4.11.0",
    "requests>=2.28.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
]

[project.scripts]
perfume-scanner = "perfume_scanner.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.semantic_release]
version_variables = ["src/perfume_scanner/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
branches.main = { match = "main" }
upload_to_vcs_release = true
build_command = "pip install build && python -m build"
